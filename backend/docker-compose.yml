
services:

  web:
    build: .

    container_name: trs_backend

    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    expose:
      - "8000"

  celery:
    build: .

    container_name: trs_celery

    command: celery -A core worker -l info

    env_file:
      - .env.docker

    volumes:
      - .:/app

  celery_beat:
    build: .

    container_name: trs_celery_beat

    command: celery -A core beat -l info

    env_file:
      - .env.docker

    volumes:
      - .:/app

    depends_on:
      - celery

  daphne:
    build: .

    container_name: trs_daphne

    command: daphne -b 0.0.0.0 -p 8001 core.asgi:application

    env_file:
      - .env.docker

    volumes:
      - .:/app

    expose:
      - "8001"


  nginx:
    image: nginx:latest

    container_name: trs_nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles

    depends_on:
      - web
      - daphne

volumes:
  static_volume: