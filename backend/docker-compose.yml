
services:

  web:
    build: .

    container_name: trs_backend

    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    expose:
      - "8000"
    depends_on:
      - redis

  celery:
    build: .

    container_name: trs_celery

    command: celery -A core worker -l info

    env_file:
      - .env.docker

    volumes:
      - .:/app
    
    depends_on:
      - redis

  celery_beat:
    build: .

    container_name: trs_celery_beat

    command: celery -A core beat -l info

    env_file:
      - .env.docker

    volumes:
      - .:/app

    depends_on:
      - celery
      - redis

  daphne:
    build: .

    container_name: trs_daphne

    command: daphne -b 0.0.0.0 -p 8001 core.asgi:application

    env_file:
      - .env.docker

    volumes:
      - .:/app

    expose:
      - "8001"
    depends_on:
      - redis


  nginx:
    image: nginx:latest

    container_name: trs_nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles

    depends_on:
      - web
      - daphne

  redis:
    image: redis:7-alpine
    container_name: trs_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  turn:
    image: coturn/coturn:latest
    container_name: trs_turn

    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf

    command: ["-c", "/etc/coturn/turnserver.conf"]

    restart: unless-stopped

volumes:
  static_volume:
  redis_data: