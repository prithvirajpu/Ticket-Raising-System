services:

  web:
    build: .

    image: trs-backend:latest

    container_name: trs_backend

    restart: unless-stopped

    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 1
      "
    env_file:
      - .env.production

    volumes:
      - static_volume:/app/staticfiles

    expose:
      - "8000"

  celery:
    image: trs-backend:latest

    container_name: trs_celery

    restart: unless-stopped

    command: celery -A core worker -l info

    env_file:
      - .env.production

    depends_on:
      - web

  celery_beat:
    image: trs-backend:latest

    container_name: trs_celery_beat

    restart: unless-stopped

    command: celery -A core beat -l info

    env_file:
      - .env.production

    depends_on:
      - celery

  daphne:
    image: trs-backend:latest

    container_name: trs_daphne

    restart: unless-stopped

    command: daphne -b 0.0.0.0 -p 8001 core.asgi:application

    env_file:
      - .env.production

    expose:
      - "8001"

  nginx:
    image: nginx:latest

    container_name: trs_nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    depends_on:
      - web
      - daphne

volumes:
  static_volume: