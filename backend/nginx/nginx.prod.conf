upstream gunicorn {
    server trs_backend:8000;
}

upstream daphne {
    server trs_daphne:8001;
}


# Redirect HTTP -> HTTPS
server {

    listen 80;

    server_name trs.prithvirajpu.online api.trs.prithvirajpu.online;


    location /.well-known/acme-challenge/ {

        root /var/www/certbot;

    }


    location / {

        return 301 https://$host$request_uri;

    }

}



# HTTPS server
server {

    listen 443 ssl;

    server_name trs.prithvirajpu.online api.trs.prithvirajpu.online;


    ssl_certificate /etc/letsencrypt/live/api.trs.prithvirajpu.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trs.prithvirajpu.online/privkey.pem;


    client_max_body_size 20M;



    location /static/ {

        alias /app/staticfiles/;

    }



    location /ws/ {

        proxy_pass http://daphne;


        proxy_http_version 1.1;


        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header X-Forwarded-Proto https;

    }



    location / {

        proxy_pass http://gunicorn;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header X-Forwarded-Proto https;

    }

}
